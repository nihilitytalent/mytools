<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Split PDF / Extract Pages – Free & Private | Image & PDF Tools</title><meta name="description" content="Pull out the pages you need into a new PDF."><link rel="stylesheet" href="style.css"></head><body><header><a class="back" href="index.html">← All tools</a><h1>✂️ Split PDF / Extract Pages</h1><p class="sub">Pull out the pages you need into a new PDF.</p></header><main><section class="panel"><label class="drop"><input type="file" id="f" accept="application/pdf"><b>📁 Tap to choose a PDF</b><br>One PDF at a time.</label><p class="note" id="info"></p><label class="note" for="rg">Pages to keep (example: 1-3, 5, 8-10)</label><input type="text" id="rg" placeholder="1-3, 5"><p class="msg" id="msg"></p><button class="btn" id="go" disabled>Extract pages</button><div id="out"></div></section><div class="ad" aria-label="Advertisement">Ad space (paste your AdSense code here)</div><h2>Questions</h2><details><summary>How do I save just some pages?</summary><p>Choose your PDF, type the page numbers (like 1-3, 5) and tap Extract pages.</p></details></main><footer><a href="index.html">Home</a> · <a href="privacy.html">Privacy Policy</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a></footer><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script src="common.js"></script><script>let src,n=0;
$('f').onchange=async e=>{$('out').innerHTML='';$('msg').textContent='';const f=e.target.files[0];if(!f)return;
try{src=await PDFLib.PDFDocument.load(await f.arrayBuffer());n=src.getPageCount();$('info').textContent=f.name+' has '+n+' pages.';$('go').disabled=false}
catch(x){$('info').textContent='';$('msg').textContent='Could not read this PDF. It may be password-protected.'}};
$('go').onclick=async()=>{$('msg').textContent='';$('out').innerHTML='';const idx=[];
try{for(const part of $('rg').value.split(',')){const m=part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw 0;const a=+m[1],b=+(m[2]||m[1]);if(a<1||b>n||a>b)throw 0;for(let i=a;i<=b;i++)idx.push(i-1)}}
catch(x){$('msg').textContent='Enter pages like 1-3, 5 (between 1 and '+n+').';return}
const o=await PDFLib.PDFDocument.create();(await o.copyPages(src,idx)).forEach(p=>o.addPage(p));
const b=new Blob([await o.save()],{type:'application/pdf'});$('out').appendChild(dlLink(b,'extracted.pdf','Download PDF ('+kb(b.size)+')'))};</script></body></html>
