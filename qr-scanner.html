<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>QR Code Scanner – Free & Private</title><meta name="description" content="Scan QR codes with your camera or from a photo. Runs on your device."><meta name="theme-color" content="#000000"><link rel="stylesheet" href="style.css"><script>try{document.documentElement.dataset.theme=localStorage.theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script><style>html,body{height:100%;overflow:hidden;background:#000}
.cs{position:fixed;inset:0;background:#000;color:#fff}#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:linear-gradient(#000a,transparent);z-index:2}
.cb{min-width:46px;height:46px;border-radius:23px;background:#0009;border:0;color:#fff;font:inherit;font-size:1.2rem;display:grid;place-items:center;text-decoration:none;cursor:pointer;padding:0 14px}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:20px 16px calc(26px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000c);z-index:2}
.cerr{position:absolute;left:24px;right:24px;top:36%;text-align:center;color:#fff;z-index:3;line-height:1.6}
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:999px;z-index:6;font-size:.9rem;white-space:nowrap}

.vf{position:absolute;left:50%;top:42%;width:68vmin;height:68vmin;max-width:340px;max-height:340px;transform:translate(-50%,-50%);z-index:1;pointer-events:none;box-shadow:0 0 0 100vmax #0006;border-radius:18px}
.vf i{position:absolute;width:36px;height:36px;border:4px solid #2ee6c0}.vf i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}.vf i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}.vf i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 18px}.vf i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.vf b{position:absolute;left:8%;right:8%;height:3px;background:#2ee6c0;box-shadow:0 0 12px #2ee6c0;animation:sl 1.8s ease-in-out infinite alternate}@keyframes sl{from{top:8%}to{top:92%}}
.sh{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);color:var(--ink);border-radius:24px 24px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom,0px));z-index:5;transform:translateY(110%);transition:transform .3s}.sh.on{transform:none}
.sh small{color:var(--at);font-weight:700}.sh p{word-break:break-all;margin:8px 0 16px;max-height:30vh;overflow:auto;white-space:pre-wrap}.sh .row2{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body><div class="cs"><video id="v" playsinline muted autoplay></video><canvas id="cv" hidden></canvas>
<div class="top"><a class="cb" href="index.html" aria-label="Close">✕</a><b>Scan QR code</b><button class="cb" id="tq" hidden aria-label="Flashlight">🔦</button></div>
<div class="vf" id="vf"><i></i><i></i><i></i><i></i><b></b></div><p class="cerr" id="err" hidden>Camera not available.<br>Allow camera access, or choose a photo from your gallery below.</p>
<div class="bar"><label class="cb" aria-label="Choose from gallery">🖼️ Gallery<input type="file" id="gal" accept="image/*"></label></div><div class="toast" id="ts" hidden></div>
<div class="sh" id="sh"><small id="ty"></small><p id="tx"></p><div class="row2"><button class="btn" id="cp">Copy</button><a class="btn alt" id="op" rel="noopener noreferrer" target="_blank" hidden>Open</a><button class="btn alt" id="sd" hidden>Share</button><button class="btn alt" id="ag">Scan again</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script><script src="common.js"></script><script>
const v=$('v'),cv=$('cv'),cx=cv.getContext('2d',{willReadFrequently:true});let stream,track,done=false,busy=false,last=0,torch=false,det=null;
try{if('BarcodeDetector' in window)det=new BarcodeDetector({formats:['qr_code']})}catch(e){det=null}
function toast(t){const e=$('ts');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2200)}
async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=stream;await v.play();track=stream.getVideoTracks()[0];const c=track.getCapabilities?track.getCapabilities():{};if(c.torch)$('tq').hidden=false;requestAnimationFrame(tick)}catch(e){$('err').hidden=false;$('vf').hidden=true}}
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop())}
function tick(t){if(done)return;requestAnimationFrame(tick);if(t-last<140||v.readyState<2||busy)return;last=t;frame()}
async function frame(){busy=true;try{let r=null;if(det){try{const b=await det.detect(v);if(b.length)r=b[0].rawValue}catch(e){det=null}}
if(!det&&!r&&typeof jsQR!=='undefined'){const w=v.videoWidth,h=v.videoHeight,m=Math.min(1,640/Math.max(w,h));cv.width=Math.round(w*m);cv.height=Math.round(h*m);cx.drawImage(v,0,0,cv.width,cv.height);const q=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});if(q)r=q.data}
if(r)found(r)}catch(e){}busy=false}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},120)}catch(e){}}
function found(s){if(done)return;done=true;if(navigator.vibrate)navigator.vibrate(70);beep();v.pause();let ty='Text',op=null,tx=s;
if(/^https?:\/\//i.test(s)){ty='🔗 Link';op=s}else if(/^mailto:/i.test(s)||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)){ty='✉️ Email';op=/^mailto:/i.test(s)?s:'mailto:'+s}else if(/^tel:/i.test(s)||/^\+?[\d\s-]{7,}$/.test(s)){ty='📞 Phone';op=/^tel:/i.test(s)?s:'tel:'+s.replace(/[\s-]/g,'')}
else if(/^WIFI:/i.test(s)){ty='📶 Wi‑Fi';const g=k=>(s.match(new RegExp('(?:^|;|:)'+k+':([^;]*)'))||[])[1]||'';tx='Network: '+g('S')+'\nPassword: '+g('P')+'\nSecurity: '+(g('T')||'none')}else ty='📝 Text';
$('ty').textContent=ty;$('tx').textContent=tx;$('op').hidden=!op;if(op)$('op').href=op;$('sd').hidden=!navigator.share;$('sh').classList.add('on')}
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('tx').textContent);toast('Copied ✓')}catch(e){toast('Press and hold the text to copy')}};
$('sd').onclick=()=>navigator.share({text:$('tx').textContent}).catch(()=>{});
$('ag').onclick=()=>{done=false;$('sh').classList.remove('on');v.play();requestAnimationFrame(tick)};
$('tq').onclick=async()=>{torch=!torch;try{await track.applyConstraints({advanced:[{torch}]});$('tq').style.background=torch?'#2ee6c0':''}catch(e){toast('Flashlight not supported')}};
$('gal').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const i=await loadImg(f);let r=null;if(det){try{const b=await det.detect(i);if(b.length)r=b[0].rawValue}catch(x){}}
if(!r&&typeof jsQR!=='undefined')for(const mx of[1200,800,500,1800]){const m=Math.min(1,mx/Math.max(i.naturalWidth,i.naturalHeight));cv.width=Math.round(i.naturalWidth*m);cv.height=Math.round(i.naturalHeight*m);cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(i,0,0,cv.width,cv.height);const q=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'attemptBoth'});if(q){r=q.data;break}}
if(r){done=false;found(r)}else toast('No QR code found in that image')}catch(x){toast('Could not read that image')}};
addEventListener('pagehide',stop);start();
</script></body></html>
