<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QR Code Generator – Free & Private | Image & PDF Tools</title><meta name="description" content="Make a QR code for a link, text, Wi-Fi name or phone number."><link rel="stylesheet" href="style.css"><meta name="theme-color" content="#101113"></head><body><header><a class="back" href="index.html">← All tools</a><h1>🔳 QR Code Generator</h1><p class="sub">Make a QR code for a link, text, Wi-Fi name or phone number.</p></header><main><section class="panel"><label class="note" for="t">Link or text</label><input type="text" id="t" placeholder="https://example.com"><div class="opts"><label>Size<select id="sz"><option value="256">Medium</option><option value="400">Large</option></select></label></div><p class="msg" id="msg"></p><button class="btn" id="go">Make QR code</button><div id="qr" style="background:#fff;padding:16px;display:none;margin:16px auto 0;width:fit-content;border-radius:12px"></div><div id="out"></div></section><div class="ad" aria-label="Advertisement">Ad space (paste your AdSense code here)</div><h2>Questions</h2><details><summary>Is the QR code permanent?</summary><p>Yes. It simply contains your text or link, so it never expires.</p></details></main><footer><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a></footer><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="common.js"></script><script>$('go').onclick=()=>{const t=$('t').value.trim(),s=+$('sz').value,q=$('qr');$('out').innerHTML='';if(!t){$('msg').textContent='Enter a link or text first.';return}$('msg').textContent='';q.innerHTML='';q.style.display='block';

$('out').appendChild(dlLink(await toBlob(o,'image/png'),'qr-code.png','Download PNG'))},100)};</script></body></html>
