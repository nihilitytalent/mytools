<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ID Card Scan: Front and Back on One Page – Free & Private | Image & PDF Tools</title><meta name="description" content="Photograph both sides of an ID card and get one tidy A4 PDF."><link rel="stylesheet" href="style.css"><meta name="theme-color" content="#101113"></head><body><header><a class="back" href="index.html">← All tools</a><h1>🪪 ID Card Scan: Front and Back on One Page</h1><p class="sub">Photograph both sides of an ID card and get one tidy A4 PDF.</p></header><main><section class="panel"><label class="drop"><input type="file" id="f1" accept="image/*"><b>🪪 Front side</b><br>Camera or gallery.</label><label class="drop"><input type="file" id="f2" accept="image/*"><b>🔄 Back side (optional)</b><br>Camera or gallery.</label><p class="msg" id="msg"></p><button class="btn" id="go">Create PDF</button><div id="out"></div></section><div class="ad" aria-label="Advertisement">Ad space (paste your AdSense code here)</div><h2>Questions</h2><details><summary>Is it private?</summary><p>Yes. The photos are processed on your device and never uploaded.</p></details></main><footer><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a></footer><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="common.js"></script><script>$('go').onclick=async()=>{const fs=[$('f1').files[0],$('f2').files[0]].filter(Boolean);$('out').innerHTML='';if(!fs.length){$('msg').textContent='Add at least the front side.';return}
$('msg').textContent='';try{const o=await PDFLib.PDFDocument.create(),pg=o.addPage([595,842]);let y=800;
for(const f of fs){const i=await loadImg(f),m=Math.min(1,1600/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*m);c.height=Math.round(i.naturalHeight*m);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
const im=await o.embedJpg(await(await toBlob(c,'image/jpeg',.9)).arrayBuffer()),w=300,h=Math.min(w*im.height/im.width,360);pg.drawImage(im,{x:(595-w)/2,y:y-h,width:w,height:h});y-=h+40}
const b=new Blob([await o.save()],{type:'application/pdf'});$('out').appendChild(dlLink(b,'id-card.pdf','Download PDF ('+kb(b.size)+')'))}catch(x){$('msg').textContent='Could not create the PDF.'}};</script></body></html>
