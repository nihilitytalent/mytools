<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Document Scanner – Scan to PDF Free & Private</title><meta name="description" content="Scan documents with your camera, clean them up, and save a multi-page PDF. Runs on your device."><meta name="theme-color" content="#000000"><link rel="stylesheet" href="style.css"><script>try{document.documentElement.dataset.theme=localStorage.theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script><style>html,body{height:100%;overflow:hidden;background:#000}
.cs{position:fixed;inset:0;background:#000;color:#fff}#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:linear-gradient(#000a,transparent);z-index:2}
.cb{min-width:46px;height:46px;border-radius:23px;background:#0009;border:0;color:#fff;font:inherit;font-size:1.2rem;display:grid;place-items:center;text-decoration:none;cursor:pointer;padding:0 14px}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:20px 16px calc(26px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000c);z-index:2}
.cerr{position:absolute;left:24px;right:24px;top:36%;text-align:center;color:#fff;z-index:3;line-height:1.6}
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:999px;z-index:6;font-size:.9rem;white-space:nowrap}

#shut{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:none;padding:0;cursor:pointer;position:relative}#shut::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff;transition:transform .12s}#shut:active::after{transform:scale(.82)}
.guide{position:absolute;inset:14% 7% 24%;border:2px dashed #fff8;border-radius:14px;pointer-events:none;z-index:1}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .25s}.flash.on{opacity:.8;transition:none}
#rev{position:fixed;inset:0;overflow:auto;background:var(--bg);color:var(--ink);padding:0 0 40px;-webkit-overflow-scrolling:touch}#rev .in{max-width:680px;margin:0 auto;padding:0 18px}
.chips2{display:flex;gap:8px;overflow-x:auto;margin:6px 0 12px}.chips2 button{flex:none;border:0;border-radius:999px;padding:9px 16px;background:var(--ring);color:var(--mute);font:inherit;font-weight:600;cursor:pointer}.chips2 .on{background:var(--acc);color:#fff}
.dn{position:absolute;right:-4px;top:-4px;background:#2ee6c0;color:#000;border-radius:99px;font-size:.7rem;font-weight:800;min-width:20px;height:20px;display:grid;place-items:center}
</style></head><body><div class="cs" id="cam"><video id="v" playsinline muted autoplay></video><div class="guide"></div><div class="flash" id="fl"></div>
<div class="top"><a class="cb" href="index.html" aria-label="Close">✕</a><b id="ct">Scan document</b><button class="cb" id="tq" hidden aria-label="Flashlight">🔦</button></div>
<p class="cerr" id="err" hidden>Camera not available.<br>Allow camera access, or import photos from your gallery below.</p>
<div class="bar"><label class="cb" aria-label="Import from gallery">🖼️<input type="file" id="gal" accept="image/*" multiple></label><button id="shut" aria-label="Capture page"></button><button class="cb" id="dn" style="position:relative" disabled aria-label="Review pages">✓<span class="dn" id="n">0</span></button></div><div class="toast" id="ts" hidden></div></div>
<div id="rev" hidden><div class="t2"><button class="btn alt" id="bk">‹ Camera</button><b id="rt"></b></div><div class="in"><div class="chips2" id="fch"><button data-f="magic" class="on">✨ Magic</button><button data-f="orig">Original</button><button data-f="gray">Gray</button><button data-f="bw">B&amp;W</button></div>
<div class="pgs" id="grid"></div><div class="opts"><label>Page size<select id="size"><option value="a4">A4 page</option><option value="fit">Fit to scan</option></select></label></div><p class="msg" id="msg"></p><div class="opts"><button class="btn alt" id="add">＋ Add page</button><button class="btn" id="go">Save PDF</button></div><div id="out"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script src="common.js"></script><script>
let stream,track,torch=false,pages=[],filt='magic';const v=$('v');
function toast(t){const e=$('ts');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2000)}
async function start(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream;await v.play();track=stream.getVideoTracks()[0];const c=track.getCapabilities?track.getCapabilities():{};if(c.torch)$('tq').hidden=false;$('err').hidden=true}catch(e){$('err').hidden=false}}
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
function count(){$('n').textContent=pages.length;$('dn').disabled=!pages.length;$('ct').textContent=pages.length?'Page '+(pages.length+1):'Scan document'}
function add(c){pages.push({src:c,rot:0});count();if(navigator.vibrate)navigator.vibrate(30)}
$('shut').onclick=()=>{const w=v.videoWidth,h=v.videoHeight;if(!w){toast('Camera not ready');return}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0);add(c);const f=$('fl');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),60);toast('Page '+pages.length+' captured')};
$('tq').onclick=async()=>{torch=!torch;try{await track.applyConstraints({advanced:[{torch}]});$('tq').style.background=torch?'#2ee6c0':''}catch(e){toast('Flashlight not supported')}};
$('gal').onchange=async e=>{const fs=[...e.target.files];e.target.value='';for(const f of fs){try{const i=await loadImg(f),m=Math.min(1,2400/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*m);c.height=Math.round(i.naturalHeight*m);c.getContext('2d').drawImage(i,0,0,c.width,c.height);add(c)}catch(x){toast('Could not read '+f.name)}}if(pages.length)review()};
function flt(x,w,h){if(filt==='orig')return;const d=x.getImageData(0,0,w,h),p=d.data,H=new Uint32Array(256);for(let k=0;k<p.length;k+=16)H[(.299*p[k]+.587*p[k+1]+.114*p[k+2])|0]++;
const T=H.reduce((a,b)=>a+b,0);let lo=0,hi=255,a=0;for(let i=0;i<256;i++){a+=H[i];if(a>T*.01){lo=i;break}}a=0;for(let i=255;i>=0;i--){a+=H[i];if(a>T*.01){hi=i;break}}if(hi-lo<30){lo=0;hi=255}const s=255/(hi-lo);
for(let k=0;k<p.length;k+=4){const l=(.299*p[k]+.587*p[k+1]+.114*p[k+2]-lo)*s;if(filt==='magic'){for(let j=0;j<3;j++)p[k+j]=Math.max(0,Math.min(255,(p[k+j]-lo)*s*1.08))}else{const g=filt==='bw'?(l>145?255:0):Math.max(0,Math.min(255,l));p[k]=p[k+1]=p[k+2]=g}}x.putImageData(d,0,0)}
function proc(p,mx){const s=p.src,r=p.rot%180,w0=r?s.height:s.width,h0=r?s.width:s.height,k=Math.min(1,mx/Math.max(w0,h0)),c=document.createElement('canvas');c.width=Math.round(w0*k);c.height=Math.round(h0*k);const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(p.rot*Math.PI/180);x.drawImage(s,-s.width*k/2,-s.height*k/2,s.width*k,s.height*k);x.setTransform(1,0,0,1,0,0);flt(x,c.width,c.height);return c}
function draw(){const g=$('grid');g.innerHTML='';$('rt').textContent=pages.length+' page'+(pages.length>1?'s':'');pages.forEach((p,k)=>{const d=document.createElement('div');d.className='pg';const th=document.createElement('div');th.className='th';th.appendChild(proc(p,360));d.appendChild(th);d.append('Page '+(k+1));d.appendChild(document.createElement('br'));
[['⟲',()=>{p.rot=(p.rot+270)%360}],['⟳',()=>{p.rot=(p.rot+90)%360}],['◀',()=>{if(k>0)[pages[k-1],pages[k]]=[pages[k],pages[k-1]]}],['▶',()=>{if(k<pages.length-1)[pages[k+1],pages[k]]=[pages[k],pages[k+1]]}],['🗑',()=>{pages.splice(k,1)}]].forEach(([t,fn])=>{const b=document.createElement('button');b.className='btn alt';b.textContent=t;b.onclick=()=>{fn();if(!pages.length){back();return}draw()};d.appendChild(b)});g.appendChild(d)})}
function review(){stop();$('cam').hidden=true;$('rev').hidden=false;$('out').innerHTML='';$('msg').textContent='';draw()}
function back(){$('rev').hidden=true;$('cam').hidden=false;count();start()}
$('dn').onclick=review;$('bk').onclick=back;$('add').onclick=back;
document.querySelectorAll('#fch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#fch button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filt=b.dataset.f;draw()});
$('go').onclick=async()=>{$('out').innerHTML='';$('msg').textContent='';$('go').disabled=true;$('go').textContent='Saving…';
try{const o=await PDFLib.PDFDocument.create(),a4=$('size').value==='a4';for(const p of pages){const c=proc(p,2000),im=await o.embedJpg(await(await toBlob(c,'image/jpeg',.85)).arrayBuffer()),W=c.width,H=c.height;
if(a4){const s=Math.min(555/W,802/H),pg=o.addPage([595,842]);pg.drawImage(im,{x:(595-W*s)/2,y:(842-H*s)/2,width:W*s,height:H*s})}else o.addPage([W,H]).drawImage(im,{x:0,y:0,width:W,height:H})}
const b=new Blob([await o.save()],{type:'application/pdf'}),d=new Date(),nm='scan-'+d.toISOString().slice(0,16).replace(/[-:T]/g,'')+'.pdf';$('out').appendChild(dlLink(b,nm,'Download PDF ('+kb(b.size)+')'));
const f=new File([b],nm,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){const s=document.createElement('button');s.className='btn alt';s.style.marginLeft='8px';s.textContent='Share';s.onclick=()=>navigator.share({files:[f]}).catch(()=>{});$('out').appendChild(s)}}
catch(x){$('msg').textContent='Could not create the PDF.'}$('go').disabled=false;$('go').textContent='Save PDF'};
addEventListener('pagehide',stop);start();count();
</script></body></html>
