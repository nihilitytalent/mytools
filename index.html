<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Free Image & PDF Tools – Scan, Compress, Merge, Edit, Lock</title><meta name="description" content="Free private tools: scan photos to PDF, compress, merge, split and edit PDFs, convert files. Runs on your device."><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><script>try{document.documentElement.dataset.theme=localStorage.theme||"dark"}catch(e){document.documentElement.dataset.theme="dark"}try{if(localStorage.camStart==='1'&&matchMedia('(display-mode: standalone)').matches&&!sessionStorage.cs){sessionStorage.cs='1';location.replace('image-to-pdf.html')}}catch(e){}</script></head><body class="app">

<script src="tools.js"></script><script>
const $=id=>document.getElementById(id),by=s=>TOOLS.find(t=>t[0]===s);
[['image-to-pdf','📸','Scan','#ec4899'],['tools','📄','PDF Tools','#ef4444'],['image-to-pdf','🖼️','Import Images','#3b82f6'],['merge-pdf','📁','Import Files','#6366f1'],['id-card-scan','🪪','ID Cards','#06b6d4'],['extract-text','🔤','Extract Text','#14b8a6'],['compress-pdf','📉','Compress','#f97316'],['tools','🧩','All','#8b5cf6']].forEach(x=>$('qk').insertAdjacentHTML('beforeend',link([x[0],x[1],x[2],x[3]])));
function rc(){const q=$('q').value.trim().toLowerCase();if(q){$('sh').firstChild.textContent='Results ';const r=TOOLS.filter((t,i)=>t[3]!=='import'&&t[2].toLowerCase().includes(q));$('rc').innerHTML=r.length?r.map(t=>link(t,'row')).join(''):'<p class="note">No tools found.</p>';return}

$('q').oninput=rc;rc();
</script></body></html>
