<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Images to PowerPoint – Free & Private | Image & PDF Tools</title><meta name="description" content="Put photos or screenshots on slides, one image per slide."><link rel="stylesheet" href="style.css"><meta name="theme-color" content="#101113"></head><body><header><a class="back" href="index.html">← All tools</a><h1>🖥️ Images to PowerPoint</h1><p class="sub">Put photos or screenshots on slides, one image per slide.</p></header><main><section class="panel"><label class="drop"><input type="file" id="f" accept="image/*" multiple><b>🖼️ Tap to add images</b><br>Add several, then reorder.</label><ul class="list" id="list"></ul><p class="note" id="st"></p><p class="msg" id="msg"></p><button class="btn" id="go" disabled>Create PowerPoint</button><div id="out"></div></section><div class="ad" aria-label="Advertisement">Ad space (paste your AdSense code here)</div><h2>Questions</h2><details><summary>Do images get cropped?</summary><p>No. Each image is fitted inside a 16:9 slide without cropping.</p></details></main><footer><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a></footer><script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script><script src="common.js"></script><script>let files=[];$('f').onchange=e=>{files=files.concat([...e.target.files]);e.target.value='';$('out').innerHTML='';draw()};
const draw=()=>{orderList($('list'),files,draw);$('go').disabled=!files.length};draw();
$('go').onclick=async()=>{$('msg').textContent='';$('out').innerHTML='';$('go').disabled=true;
try{const p=new PptxGenJS();p.layout='LAYOUT_16x9';let n=0;for(const f of files){$('st').textContent='Image '+(++n)+' of '+files.length+'…';const i=await loadImg(f),m=Math.min(1,1600/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*m);c.height=Math.round(i.naturalHeight*m);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
const s=Math.min(10/c.width,5.625/c.height),w=c.width*s,h=c.height*s;p.addSlide().addImage({data:c.toDataURL('image/jpeg',.88).slice(5),x:(10-w)/2,y:(5.625-h)/2,w,h})}
const b=new Blob([await p.write({outputType:'blob'})],{type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});$('st').textContent='Done.';$('out').appendChild(dlLink(b,'slides.pptx','Download PowerPoint ('+kb(b.size)+')'))}
catch(x){$('msg').textContent='Could not create the PowerPoint.'}draw()};</script></body></html>
